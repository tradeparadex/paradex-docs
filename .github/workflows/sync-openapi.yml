name: Update OpenAPI Specification

# Pulls the latest REST specs from the API (scripts/sync-openapi.mjs) and
# opens a pull request when they changed.
on:
  pull_request:
    paths:
      - '.github/workflows/sync-openapi.yml'
      - 'scripts/sync-openapi.mjs'
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1-5"

jobs:
  update-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check existing PRs
        id: check-prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_ALREADY_EXISTS=false
          pr_list=$(gh pr list \
            --json number,title,state \
            --jq '.[] | select(.title | startswith("Update API"))')
          if [[ -n "$pr_list" ]]; then
            echo "Found PR(s):"
            echo "$pr_list"
            PR_ALREADY_EXISTS=true
          else
            echo "No PR found"
          fi
          echo "PR_ALREADY_EXISTS=${PR_ALREADY_EXISTS}" >> $GITHUB_OUTPUT

      - name: Setup Node
        if: ${{ steps.check-prs.outputs.PR_ALREADY_EXISTS == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: ${{ steps.check-prs.outputs.PR_ALREADY_EXISTS == 'false' }}
        run: corepack enable && yarn install --immutable

      - name: Sync specs
        if: ${{ steps.check-prs.outputs.PR_ALREADY_EXISTS == 'false' }}
        run: yarn sync-openapi

      - name: Open pull request
        if: ${{ steps.check-prs.outputs.PR_ALREADY_EXISTS == 'false' && github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.OPENAPI_SYNC_TOKEN || github.token }}
          branch: update-openapi-spec
          commit-message: Update API specifications
          title: Update API specifications
          body: Automated update of `docs/apis/*/openapi/openapi.json` from the live API (`yarn sync-openapi`).
          add-paths: docs/apis/**
