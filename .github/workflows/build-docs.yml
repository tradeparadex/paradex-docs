name: Build Docs

# Builds the site on every pull request. The build fails on broken internal
# links, MDX errors or a bad navigation.yml, so this is the main docs check.
# Pull requests from this repository also get a Cloudflare preview URL
# (a Worker version that is uploaded but not deployed), posted as a comment.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.147.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Needs no build output, so it runs before (and independently of) the build.
      - name: Test edge layer (MCP server, Markdown routes)
        run: yarn test:edge

      - name: Build
        run: yarn build

      # After the build: src/generated/icons.json, which src/ imports, is
      # written by the build (plugins/site.mjs), so tsc cannot run on a clean
      # checkout before it.
      - name: Typecheck
        run: yarn typecheck

      - name: Check site structure
        run: yarn check

      - name: Upload site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: build
          retention-days: 7
          include-hidden-files: true

  preview:
    needs: build
    # Fork pull requests get no secrets, so no preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: docs-preview
          path: build

      # Uploads a version of the Worker without deploying it; production keeps
      # serving main. Previews only work once main has been deployed once.
      - name: Upload preview to Cloudflare
        id: upload
        # A failed preview must not block the pull request; it is reported
        # as a warning instead.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets in this repository, so no preview."
            exit 0
          fi
          if ! npx --yes "wrangler@${WRANGLER_VERSION}" versions upload \
            --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER} ${HEAD_SHA::12}"; then
            echo "::warning::The Cloudflare preview upload failed; see this step's log."
            exit 1
          fi
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          if [ -z "$url" ]; then
            echo "::warning::No preview URL: preview_urls is off for the paradex-docs Worker."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: docs-preview
          message: |
            🚀 Docs preview: ${{ steps.upload.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}.
