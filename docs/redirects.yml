# Redirects from old URLs. `:slug*` matches the rest of the path.
# Read by plugins/redirects.mjs, which emits static redirect pages for every
# known URL plus a client-side fallback on the 404 page and a `_redirects`
# file for hosts that support server-side rules.

redirects:
  # Redirect root to Home tab landing
  - source: "/"
    destination: "/home"

  # Redirects from old /overview/ prefix to new /docs/ tab
  - source: "/overview/getting-started/:slug*"
    destination: "/docs/getting-started/:slug*"
  - source: "/overview/xp-referrals/:slug*"
    destination: "/docs/xp-referrals/:slug*"
  - source: "/overview/:slug*"
    destination: "/docs/:slug*"
  - source: "/overview"
    destination: "/docs"

  # Legacy root-level redirects
  - source: "/xp-referrals/:slug*"
    destination: "/docs/xp-referrals/:slug*"

  # Redirect old /getting-started/ URLs to new /docs/ tab
  - source: "/getting-started/:slug*"
    destination: "/docs/:slug*"

  # Redirect old /start/ URLs to new /docs/ tab
  - source: "/start/:slug*"
    destination: "/docs/:slug*"

  # Redirect old /docs/trading/ URLs to /trading/ tab
  - source: "/docs/trading/:slug*"
    destination: "/trading/:slug*"

  # Redirect old /docs/risk/ URLs to /risk/ tab
  - source: "/docs/risk/:slug*"
    destination: "/risk/:slug*"

  # Redirect old /docs/security/ URLs to /chain/security/
  - source: "/docs/security/:slug*"
    destination: "/chain/security/:slug*"
  - source: "/security/:slug*"
    destination: "/chain/security/:slug*"

  # Redirect old /docs/paradex-chain/ URLs to /chain/
  - source: "/docs/paradex-chain/:slug*"
    destination: "/chain/:slug*"
  - source: "/paradex-chain/:slug*"
    destination: "/chain/:slug*"

  # Redirect old /docs/ecosystem/ URLs to /ecosystem/
  - source: "/docs/ecosystem/:slug*"
    destination: "/ecosystem/:slug*"

  # Redirect old /docs/release-notes/ URLs to /releases/
  - source: "/docs/release-notes/:slug*"
    destination: "/releases/:slug*"
  - source: "/release-notes/:slug*"
    destination: "/releases/:slug*"

  # Redirect deleted per-version release-note pages to the new changelog
  - source: "/releases/archive/:slug*"
    destination: "/releases"

  - source: "/releases/v-1-152"
    destination: "/releases"
  - source: "/releases/v-1-150"
    destination: "/releases"
  - source: "/releases/overview"
    destination: "/releases"

  - source: "/accounts/:slug*"
    destination: "/docs/accounts/:slug*"

  # Legacy /documentation/ prefix redirects
  - source: "/documentation/getting-started/architecture-overview/wallet-integration"
    destination: "/docs/accounts/wallet-integration"
  - source: "/documentation/vaults/:slug*"
    destination: "/vtfs/:slug*"
  - source: "/documentation/instruments-guide/:slug*"
    destination: "/trading/instruments-guide/:slug*"
  - source: "/documentation/risk-system/:slug*"
    destination: "/risk/:slug*"
  - source: "/documentation/advanced-trading-features/self-trade-prevention"
    destination: "/trading/self-trade-prevention"
  - source: "/documentation/advanced-trading-features/receive-window"
    destination: "/trading/receive-window"
  - source: "/documentation/points-referrals/:slug*"
    destination: "/docs/xp-referrals/:slug*"
  - source: "/documentation/:slug*"
    destination: "/docs/:slug*"

  # Legacy /api-reference/ and /websocket-reference/ redirects
  - source: "/api-reference/:slug*"
    destination: "/api/:slug*"
  - source: "/websocket-reference/:slug*"
    destination: "/ws/:slug*"

  # Redirect old maintenance page to consolidated trading page
  # Redirect old /home/getting-started/ to /getting-started/getting-started/
  - source: "/home/getting-started/:slug*"
    destination: "/docs/getting-started/:slug*"
  - source: "/home/xp-referrals/:slug*"
    destination: "/docs/xp-referrals/:slug*"

  - source: "/docs/getting-started/maintenance"
    destination: "/docs/maintenance-mode"

  # Redirect old /docs/roadmap to /docs/getting-started/roadmap
  - source: "/docs/roadmap"
    destination: "/docs/getting-started/roadmap"

  # Specific page redirects for renamed/moved pages
  - source: "/docs/risk/paradex-risk-system"
    destination: "/risk/margin-system"
  - source: "/risk/paradex-risk-system"
    destination: "/risk/margin-system"
  - source: "/trading/trading-fee"
    destination: "/trading/trading-fees"
  - source: "/docs/trading/trading-fee"
    destination: "/trading/trading-fees"

  # Redirects for pages moved from Trading to REST API
  - source: "/trading/api-authentication"
    destination: "/api/general-information/api-authentication"
  - source: "/trading/api-best-practices"
    destination: "/api/general-information/api-best-practices"

  # Redirect old combined other-clients page to Windsurf
  - source: "/agentic-ai-hub/mcp/other-clients"
    destination: "/agentic-ai-hub/mcp/windsurf"
  # Redirect old consolidated page to quickstart
  - source: "/agentic-ai-hub/mcp/connect-your-client"
    destination: "/agentic-ai-hub/mcp/quickstart"
  # Redirect old Remote MCP page to new Remote MCP section
  - source: "/agentic-ai-hub/mcp/remote-mcp"
    destination: "/agentic-ai-hub/remote-mcp/quickstart"
  # Redirect old Paradex-hosted MCP URL to new section
  - source: "/agentic-ai-hub/mcp/paradex-hosted-mcp"
    destination: "/agentic-ai-hub/paradex-hosted-mcp"

  # Redirects for pages moved from Trading to Overview
  - source: "/trading/vaults/:slug*"
    destination: "/vtfs/:slug*"
  - source: "/docs/vaults/:slug*"
    destination: "/vtfs/:slug*"
  - source: "/trading/accounts/:slug*"
    destination: "/docs/accounts/:slug*"
  - source: "/trading/maintenance-mode"
    destination: "/docs/maintenance-mode"
  - source: "/trading/testnet-faqs"
    destination: "/docs/testnet-faqs"
  - source: "/trading/mobile-access-guide"
    destination: "/docs/mobile-access-guide"

  # Redirect old fastfill slug to fastfills
  - source: "/trading/fastfill"
    destination: "/trading/fastfills"

  # Redirect old RWA page to TradFi Price Oracle
  - source: "/trading/rwa"
    destination: "/trading/tradfi-markets"

  # Redirects for Placing Orders restructured under Orders section
  - source: "/trading/placing-orders/:slug*"
    destination: "/trading/orders/:slug*"
  - source: "/trading/placing-orders"
    destination: "/trading/orders/placing-orders"

  # Redirect staking to Trading Fees staking section
  - source: "/staking"
    destination: "/trading/trading-fees#stake-dime"
  # Redirect old v2 URL to Trading Fees
  - source: "/trading/trading-fees-v2"
    destination: "/trading/trading-fees"
